<svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="280" height="180">
    <style>
        .card__s0 { fill: var(--neutral-100, transparent); stroke: var(--neutral-800, #d4d4d4); stroke-width: 2; }
        .card__bg {
            fill: var(--neutral-200, #f5f5f5);
            stroke: var(--neutral-400, #d4d4d4);
            stroke-width: 1;
        }
        .card__icon-circle {
            fill: transparent;
            stroke: var(--neutral-600, #888);
            stroke-width: 2;
        }
        .card__icon-element {
            fill: var(--neutral-600, #888);
        }
        .card__title {
            font-size: 11px;
            color: var(--neutral-800);
            font-weight: 700;
            text-align: left;
            text-transform: initial;
        }
        .card__text {
            font-size: 8px;
            color: var(--neutral-700);
            font-weight: 400;
            line-height: 1.5;
            text-align: justify;
            text-transform: initial;
        }
        .card__button-border {
            fill: transparent;
            stroke: var(--primary-400, #3b82f6);
            stroke-width: 2;
        }
        .card__button-text {
            font-size: 8px;
            color: var(--primary-400, #3b82f6);
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
    <path fill-rule="evenodd" class="card__s0"
          d="m5 0h270c2.76 0 5 2.24 5 5v170c0 2.76-2.24 5-5 5h-270c-2.76 0-5-2.24-5-5v-170c0-2.76 2.24-5 5-5z"/>
    <rect x="15" y="15" width="250" height="150" rx="6" class="card__bg"/>
    <g transform="translate(140, 45)">
        <rect x="-15" y="-15" width="30" height="30" rx="3" class="card__icon-circle"/>
        <circle cx="5" cy="-5" r="4" class="card__icon-element"/>
        <path d="M -15 10 L -5 -2 L 3 5 L 12 -5 L 15 0 L 15 15 L -15 15 Z" class="card__icon-element"/>
    </g>
    <foreignObject x="30" y="75" width="220" height="25">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <div class="card__title">My great title</div>
        </div>
    </foreignObject>
    <foreignObject x="30" y="95" width="220" height="45">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <div class="card__text">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor
                incididunt ut labore et dolore magna aliqua. Quis ipsum suspendisse ultrices gravida.
            </div>
        </div>
    </foreignObject>
    <rect x="80" y="140" width="120" height="16" rx="4" class="card__button-border"/>
    <foreignObject x="80" y="140" width="120" height="16">
        <div xmlns="http://www.w3.org/1999/xhtml"
             style="display: flex; align-items: center; justify-content: center; height: 100%;">
            <span class="card__button-text">BUTTON</span>
        </div>
    </foreignObject>
</svg>