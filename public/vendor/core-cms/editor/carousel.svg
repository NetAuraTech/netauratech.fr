        <div xmlns="http://www.w3.org/1999/xhtml">
            <div class="carousel__title-text">My great title</div>
        </div>
    </foreignObject>
    <rect x="15" y="50" width="50" height="85" rx="4" class="carousel__slide-inactive"/>
    <circle cx="35" cy="70" r="4" class="carousel__sun" opacity="0.5"/>
