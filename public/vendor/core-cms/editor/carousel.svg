<svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="280" height="180">
    <style>
        .carousel__s0 { fill: var(--neutral-100, transparent); stroke: var(--neutral-800, #d4d4d4); stroke-width: 2; }
        .carousel__title-text {
            font-size: 14px;
            color: var(--neutral-800);
            font-weight: 700;
            text-align: left;
            text-transform: initial;
        }
        .carousel__slide-active {
            fill: var(--neutral-200, #e5e5e5);
            stroke: var(--primary-400, #3b82f6);
            stroke-width: 2;
        }
        .carousel__slide-inactive {
            fill: var(--neutral-300, #d0d0d0);
            opacity: 0.5;
        }
        .carousel__image-icon {
            fill: var(--neutral-400, #a0a0a0);
        }
        .carousel__sun {
            fill: var(--primary-400, #fbbf24);
        }
        .carousel__arrow {
            fill: var(--neutral-700, #404040);
        }
        .carousel__dot-active {
            fill: var(--primary-400, #3b82f6);
        }
        .carousel__dot-inactive {
            fill: var(--neutral-400, #d0d0d0);
        }
    </style>
    <path fill-rule="evenodd" class="carousel__s0"
