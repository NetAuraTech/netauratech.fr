version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        uid: 1000
        user: devuser
    container_name: app-dev
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-app}
      - DB_USERNAME=${DB_USERNAME:-laravel}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    networks:
      - netauratech-network

  worker:
    build:
      context: .
    container_name: app-worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3
    volumes:
      - .:/var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - netauratech-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - netauratech-network

  redis:
    image: redis:alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - netauratech-network

volumes:
  pgdata:
    driver: local

networks:
  netauratech-network:
    driver: bridge